<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Se deschide TikTok…</title>
  <meta http-equiv="refresh" content="0; url=https://www.tiktok.com/@magiatenisului">
  <style>
    body{font-family:Inter,system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#0f2a5a;color:#fff}
    a{color:#fff}
  </style>
</head>
<body>
  <p>Se deschide <a href="https://www.tiktok.com/@magiatenisului">TikTok — @magiatenisului</a>…</p>
  <p><a href="/">Înapoi la site</a></p>
  <script>
    (function () {
      var dest = "https://www.tiktok.com/@magiatenisului";
      var nav = performance.getEntriesByType("navigation")[0];
      if (nav && nav.type === "back_forward") {
        if (history.length > 1) history.back();
        else location.replace("/");
        return;
      }
      location.href = dest;
    })();
  </script>
</body>
</html>
